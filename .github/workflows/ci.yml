name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet, unit tests, golden suite, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The golden filter cases depend on Ghostscript's rasteriser, so run in the
      # flake's dev shell: flake.lock pins the Ghostscript the fixtures were recorded with.
      - uses: cachix/install-nix-action@v31

      # Canon's data files are not in the repository; reuse them between runs
      # (scripts/fetch-canon-data.sh verifies them against data/canon/SHA256SUMS anyway).
      - uses: actions/cache@v4
        with:
          path: |
            data/canon/*.tbl
            data/canon/*.conf
            data/canon/LICENSE-*.txt
          key: canon-data-${{ hashFiles('data/canon/SHA256SUMS', 'scripts/fetch-canon-data.sh') }}

      # The private-cupsd end-to-end tests use unshare -rm; Ubuntu 24.04 runners
      # restrict unprivileged user namespaces by default.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: make test
        run: nix develop --command make test

      - name: Build and run the filter e2e
        run: nix develop --command sh -c 'make && BUILD=build bash test/cupsd/e2e_filter.sh'

  lint-and-cross:
    name: gofmt and cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Build for amd64, arm (32-bit), arm64 and riscv64
        run: make test-cross

  # ARMv6 32-bit is a supported target: run the package tests as a 32-bit ARM
  # binary under qemu-user. The golden suite is left to the nix job (its fixtures
  # depend on the pinned Ghostscript, which is host code).
  test-armv6:
    name: unit tests on 32-bit ARM (qemu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - uses: actions/cache@v4
        with:
          path: |
            data/canon/*.tbl
            data/canon/*.conf
            data/canon/LICENSE-*.txt
          key: canon-data-${{ hashFiles('data/canon/SHA256SUMS', 'scripts/fetch-canon-data.sh') }}
      - run: scripts/fetch-canon-data.sh
      - name: go test (GOARCH=arm GOARM=6)
        env:
          CGO_ENABLED: "0"
          GOARCH: arm
          GOARM: "6"
        run: go test -exec qemu-arm-static ./internal/...

  # Build the release tarballs on every push so packaging can't rot between releases.
  package:
    name: release tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make dist
      - name: Installer smoke test
        run: |
          tar -xzf dist/canon-mp280-driver-linux-amd64.tar.gz -C "$RUNNER_TEMP"
          CUPS_SERVERBIN=/usr/lib/cups CUPS_DATADIR=/usr/share/cups DESTDIR="$RUNNER_TEMP/root" "$RUNNER_TEMP/canon-mp280-driver-linux-amd64/install.sh"
          test -x "$RUNNER_TEMP/root/usr/lib/cups/filter/mp280-filter"
          test -s "$RUNNER_TEMP/root/usr/share/canon-mp280/tables/cnb_3700.tbl"
      - uses: actions/upload-artifact@v4
        with:
          name: release-tarballs
          path: dist/
