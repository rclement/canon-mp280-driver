name: Release

# Push a tag such as v0.1.0 to publish prebuilt tarballs (armv6, arm64, amd64),
# SHA256SUMS and the get.sh installer as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release tarballs
        run: make dist VERSION="$GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/SHA256SUMS scripts/get.sh \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
